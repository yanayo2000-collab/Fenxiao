spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:incentive-shadow-schema.sql,classpath:withdrawal-workflow-schema.sql,classpath:controlled-experiment-schema.sql
app:
  distribution:
    legacy-user-token-enabled: true
